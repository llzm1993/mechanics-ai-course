<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>课后习题讲解 · 《力学》AI 智慧课程</title>
<style>
  :root {
    --bg: #070b14;
    --panel: #0f172a;
    --panel-2: #131c31;
    --line: rgba(148, 163, 184, 0.16);
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #34d399;
    --accent-2: #38bdf8;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 15% 10%, #10233b, #070b14 55%);
    color: var(--text);
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }

  /* 顶栏 */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(7, 11, 20, 0.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1320px; margin: 0 auto;
    padding: 13px 22px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .home-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: rgba(56, 189, 248, 0.08);
    color: var(--accent-2); font-size: 0.85rem; font-weight: 600;
    white-space: nowrap; transition: background .18s, transform .18s;
  }
  .home-btn:hover { background: rgba(56, 189, 248, 0.18); transform: translateY(-1px); }
  .brand-title { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 1rem; }
  .brand-title .dot {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; color: #052e1a; font-size: 0.8rem; font-weight: 800;
  }
  .chapter-badge {
    font-size: 0.82rem; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; white-space: nowrap;
  }

  /* 主体 */
  .wrap { max-width: 1320px; margin: 0 auto; padding: 22px; }

  /* 章节选择 */
  .chapter-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .ch-pill {
    padding: 7px 13px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: transparent;
    color: var(--muted); font-size: 0.8rem; font-weight: 600;
    transition: all .16s;
  }
  .ch-pill:hover { color: var(--text); border-color: rgba(148,163,184,0.4); }
  .ch-pill.active { background: rgba(52,211,153,0.16); color: var(--accent); border-color: rgba(52,211,153,0.5); }
  .ch-pill.disabled { opacity: 0.42; cursor: not-allowed; }
  .ch-pill.disabled:hover { color: var(--muted); border-color: var(--line); }

  /* 两栏 */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 390px;
    gap: 24px;
    align-items: start;
  }

  /* 播放区 */
  .video-shell {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .video-shell video {
    width: 100%; height: 100%;
    display: block; background: #000; object-fit: contain;
  }
  .now { margin-top: 18px; }
  .now-head { display: flex; align-items: flex-start; gap: 12px; }
  .now-no {
    flex-shrink: 0; margin-top: 2px;
    font-size: 0.8rem; font-weight: 800; letter-spacing: .5px;
    color: var(--accent); background: rgba(52,211,153,0.12);
    border: 1px solid rgba(52,211,153,0.32);
    border-radius: 8px; padding: 5px 10px;
  }
  .now-title { font-size: 1.32rem; line-height: 1.4; font-weight: 700; }
  .now-meta { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .chip {
    font-size: 0.74rem; font-weight: 700; color: var(--accent-2);
    background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.3);
    padding: 4px 11px; border-radius: 999px;
  }
  .count { font-size: 0.8rem; color: var(--muted); }

  .controls { display: flex; align-items: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .btn {
    padding: 9px 16px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2);
    color: var(--text); font-size: 0.86rem; font-weight: 600;
    transition: all .16s;
  }
  .btn:hover:not(:disabled) { border-color: rgba(52,211,153,0.5); color: var(--accent); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .auto { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; color: var(--muted); font-size: 0.82rem; cursor: pointer; user-select: none; }
  .auto input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

  .hint { margin-top: 16px; font-size: 0.78rem; color: var(--muted); line-height: 1.6; }
  .hint kbd {
    font-family: inherit; font-size: 0.72rem; color: var(--text);
    border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px; margin: 0 2px;
  }

  /* 播放列表 */
  .playlist {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    display: flex; flex-direction: column;
    max-height: calc(100vh - 150px);
    position: sticky; top: 84px;
    overflow: hidden;
  }
  .pl-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; border-bottom: 1px solid var(--line);
    font-size: 0.9rem; font-weight: 700;
  }
  .pl-head .pl-count { font-size: 0.76rem; color: var(--muted); font-weight: 600; }
  .pl-list { list-style: none; overflow-y: auto; padding: 8px; flex: 1; }
  .pl-list::-webkit-scrollbar { width: 8px; }
  .pl-list::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.25); border-radius: 4px; }
  .pl-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 11px 12px; border-radius: 10px; cursor: pointer;
    border-left: 3px solid transparent;
    transition: background .15s, border-color .15s;
  }
  .pl-item:hover { background: rgba(148,163,184,0.07); }
  .pl-item.active { background: rgba(52,211,153,0.12); border-left-color: var(--accent); }
  .pl-item .idx {
    flex-shrink: 0; width: 26px; text-align: center;
    font-size: 0.74rem; font-weight: 800; color: var(--muted);
    padding-top: 2px;
  }
  .pl-item.active .idx { color: var(--accent); }
  .pl-item .body { min-width: 0; flex: 1; }
  .pl-item .t { font-size: 0.83rem; line-height: 1.45; color: var(--text); }
  .pl-item.active .t { font-weight: 700; }
  .pl-item .meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .pl-item .tag { font-size: 0.68rem; color: var(--accent-2); }
  .pl-item .seen { font-size: 0.68rem; color: var(--accent); }
  .pl-item .now-playing { font-size: 0.68rem; color: var(--accent); font-weight: 700; }

  /* 空状态 */
  .empty {
    padding: 64px 24px; text-align: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .empty .ico { font-size: 2.6rem; margin-bottom: 14px; }
  .empty h2 { font-size: 1.2rem; margin-bottom: 8px; }
  .empty p { color: var(--muted); font-size: 0.9rem; line-height: 1.7; }
  .empty a { color: var(--accent-2); }

  @media (max-width: 1040px) {
    .layout { grid-template-columns: 1fr; }
    .playlist { position: static; max-height: none; }
    .pl-list { max-height: 420px; }
  }
  @media (max-width: 640px) {
    .brand-title { display: none; }
    .chapter-badge { display: none; }
    .wrap { padding: 14px; }
    .now-title { font-size: 1.1rem; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <a class="home-btn" href="../../index.html">← 返回课程主页</a>
        <div class="brand-title"><span class="dot">▶</span><span>课后习题讲解</span></div>
      </div>
      <div class="chapter-badge" id="chapterBadge">第二章 · 牛顿运动定律</div>
    </div>
  </header>

  <main class="wrap">
    <div class="chapter-nav" id="chapterNav"></div>
    <div class="layout" id="layout">
      <section class="stage">
        <div class="video-shell">
          <video id="video" controls playsinline preload="metadata"></video>
        </div>
        <div class="now">
          <div class="now-head">
            <span class="now-no" id="nowNo">2-1</span>
            <h1 class="now-title" id="nowTitle">载入中…</h1>
          </div>
          <div class="now-meta">
            <span class="chip" id="nowTag">—</span>
            <span class="count" id="nowCount">第 1 / 1 讲</span>
          </div>
          <div class="controls">
            <button class="btn" id="prevBtn">← 上一讲</button>
            <button class="btn" id="nextBtn">下一讲 →</button>
            <label class="auto"><input type="checkbox" id="autoNext" /> 自动连播</label>
          </div>
          <p class="hint">
            点击右侧目录切换题目；支持键盘 <kbd>←</kbd> <kbd>→</kbd> 切换上一讲 / 下一讲。
            视频较长时可拖动进度条，建议配合课本习题同步使用。
          </p>
        </div>
      </section>

      <aside class="playlist" id="playlist">
        <div class="pl-head"><span>本章目录</span><span class="pl-count" id="plCount">—</span></div>
        <ol class="pl-list" id="plList"></ol>
      </aside>
    </div>

    <div class="empty" id="empty" hidden>
      <div class="ico">🎬</div>
      <h2>该章习题讲解正在制作中</h2>
      <p>目前已上线 <strong>第二章 · 牛顿运动定律</strong> 的 13 道习题讲解。<br />
        其他章节正在陆续录制，敬请期待。<br /><br />
        <a href="../../index.html">← 返回课程主页</a>
      </p>
    </div>
  </main>

<script>
(function () {
  "use strict";

  var CHAPTER_NAMES = [
    "质点运动学", "牛顿运动定律", "动量守恒", "动能定理与功能原理",
    "角动量与力矩", "刚体定轴转动", "刚体平面运动", "机械振动",
    "机械波", "流体力学", "万有引力与天体运动", "狭义相对论基础"
  ];

  // 视频数据：目前仅第二章上线。新增章节时在此追加即可（dir 为章节目录名）。
  var DATA = {
    2: {
      dir: "第二章",
      videos: [
        { no: "2-1",  title: "带你用整体法秒杀滑轮受力",              file: "习题2-1：带你用整体法秒杀滑轮受力.mp4", tag: "整体法" },
        { no: "2-2",  title: "悬索张力",                              file: "习题2-2：悬索张力.mp4", tag: "张力" },
        { no: "2-3",  title: "如何用微元法破解环形受力",              file: "习题2-3：如何用微元法破解环形受力.mp4", tag: "微元法" },
        { no: "2-4",  title: "为什么绕几圈绳子就能拉住大船？",        file: "习题2-4：为什么绕几圈绳子就能拉住大船？.mp4", tag: "欧拉摩擦" },
        { no: "2-5①", title: "为什么叠放系统中的内部摩擦力会「翻倍」？", file: "习题2-5：为什么叠放系统中的内部摩擦力会“翻倍”？.mp4", tag: "叠放摩擦" },
        { no: "2-5②", title: "斜面叠放物块的临界拉力",                file: "习题2-5：斜面叠放物块的临界拉力.mp4", tag: "临界问题" },
        { no: "2-6",  title: "讲解气球载鸟的动力学陷阱",              file: "习题2-6：讲解气球载鸟的动力学陷阱.mp4", tag: "动力学陷阱" },
        { no: "2-7",  title: "如何用分离变量法求解变力运动",          file: "习题2-7：如何用分离变量法求解变力运动.mp4", tag: "分离变量" },
        { no: "2-8",  title: "变力爬绳如何巧妙消去未知拉力",          file: "习题2-8：变力爬绳如何巧妙消去未知拉力.mp4", tag: "变力" },
        { no: "2-9",  title: "如何破解二次阻力上抛难题",              file: "习题2-9：如何破解二次阻力上抛难题.mp4", tag: "二次阻力" },
        { no: "2-10", title: "向心力的隐藏来源",                      file: "习题2-10_向心力的隐藏来源.mp4", tag: "向心力" },
        { no: "2-11", title: "巧解多体系统的运动学几何约束",          file: "习题2-11：巧解多体系统的运动学几何约束.mp4", tag: "几何约束" },
        { no: "2-12", title: "空气阻力下的真实抛体轨迹推导",          file: "习题2-12：空气阻力下的真实抛体轨迹推导.mp4", tag: "空气阻力" }
      ]
    }
  };

  var videoEl   = document.getElementById("video");
  var nowNo     = document.getElementById("nowNo");
  var nowTitle  = document.getElementById("nowTitle");
  var nowTag    = document.getElementById("nowTag");
  var nowCount  = document.getElementById("nowCount");
  var prevBtn   = document.getElementById("prevBtn");
  var nextBtn   = document.getElementById("nextBtn");
  var autoNext  = document.getElementById("autoNext");
  var plList    = document.getElementById("plList");
  var plCount   = document.getElementById("plCount");
  var chapterNav= document.getElementById("chapterNav");
  var chapterBadge = document.getElementById("chapterBadge");
  var layout    = document.getElementById("layout");
  var emptyEl   = document.getElementById("empty");

  var params = new URLSearchParams(location.search);
  var currentChapter = parseInt(params.get("ch"), 10);
  if (!currentChapter || !DATA[currentChapter]) currentChapter = DATA[2] ? 2 : 0;

  var videos = [];
  var currentIndex = 0;

  var SEEN_KEY = "mech_exercise_seen";
  function loadSeen() {
    try { return JSON.parse(localStorage.getItem(SEEN_KEY) || "{}"); } catch (e) { return {}; }
  }
  function saveSeen(obj) {
    try { localStorage.setItem(SEEN_KEY, JSON.stringify(obj)); } catch (e) {}
  }
  var seen = loadSeen();

  function videoSrc(ch, v) {
    var dir = DATA[ch].dir;
    return encodeURI(dir + "/" + v.file);
  }

  function renderChapterNav() {
    chapterNav.innerHTML = "";
    CHAPTER_NAMES.forEach(function (name, i) {
      var ch = i + 1;
      var has = DATA[ch] && DATA[ch].videos && DATA[ch].videos.length;
      var b = document.createElement("button");
      b.className = "ch-pill" + (ch === currentChapter ? " active" : "") + (has ? "" : " disabled");
      b.textContent = "第 " + ch + " 章 · " + name;
      b.title = has ? "查看本章习题讲解" : "该章讲解制作中";
      b.addEventListener("click", function () {
        if (!has) return;
        goChapter(ch);
      });
      chapterNav.appendChild(b);
    });
  }

  function goChapter(ch) {
    currentChapter = ch;
    videos = (DATA[ch] && DATA[ch].videos) || [];
    currentIndex = 0;
    var name = CHAPTER_NAMES[ch - 1] || "";
    chapterBadge.textContent = "第" + ch + "章 · " + name;
    renderChapterNav();
    var hasVideos = videos.length > 0;
    layout.hidden = !hasVideos;
    emptyEl.hidden = hasVideos;
    if (!hasVideos) return;
    renderPlaylist();
    setVideo(0, false);
  }

  function renderPlaylist() {
    plList.innerHTML = "";
    plCount.textContent = videos.length + " 讲";
    videos.forEach(function (v, i) {
      var li = document.createElement("li");
      li.className = "pl-item" + (i === currentIndex ? " active" : "");
      var seenKey = currentChapter + ":" + v.no;
      var isSeen = !!seen[seenKey];
      li.innerHTML =
        '<span class="idx">' + v.no + '</span>' +
        '<span class="body">' +
          '<span class="t">' + v.title + '</span>' +
          '<span class="meta">' +
            '<span class="tag">' + v.tag + '</span>' +
            (i === currentIndex ? '<span class="now-playing">正在播放</span>' : (isSeen ? '<span class="seen">✓ 已看完</span>' : '')) +
          '</span>' +
        '</span>';
      li.addEventListener("click", function () { setVideo(i, true); });
      plList.appendChild(li);
    });
  }

  function setVideo(i, autoplay) {
    if (!videos.length) return;
    i = Math.max(0, Math.min(videos.length - 1, i));
    currentIndex = i;
    var v = videos[i];

    videoEl.src = videoSrc(currentChapter, v);
    videoEl.load();

    nowNo.textContent = v.no;
    nowTitle.textContent = v.title;
    nowTag.textContent = v.tag;
    nowCount.textContent = "第 " + (i + 1) + " / " + videos.length + " 讲";

    prevBtn.disabled = (i === 0);
    nextBtn.disabled = (i === videos.length - 1);

    // 更新列表高亮
    Array.prototype.forEach.call(plList.children, function (li, idx) {
      li.classList.toggle("active", idx === i);
    });
    var activeLi = plList.children[i];
    if (activeLi) {
      // 重绘当前项的状态文字
      renderPlaylist();
      var a = plList.children[i];
      if (a) a.scrollIntoView({ block: "nearest" });
    }

    if (autoplay) {
      var p = videoEl.play();
      if (p && p.catch) p.catch(function () {});
    }
  }

  function markSeen() {
    var v = videos[currentIndex];
    if (!v) return;
    seen[currentChapter + ":" + v.no] = true;
    saveSeen(seen);
    renderPlaylist();
  }

  videoEl.addEventListener("ended", function () {
    markSeen();
    if (autoNext.checked && currentIndex < videos.length - 1) {
      setVideo(currentIndex + 1, true);
    }
  });

  prevBtn.addEventListener("click", function () { setVideo(currentIndex - 1, true); });
  nextBtn.addEventListener("click", function () { setVideo(currentIndex + 1, true); });

  autoNext.checked = (function () {
    try { return localStorage.getItem("mech_exercise_autonext") === "1"; } catch (e) { return false; }
  })();
  autoNext.addEventListener("change", function () {
    try { localStorage.setItem("mech_exercise_autonext", autoNext.checked ? "1" : "0"); } catch (e) {}
  });

  document.addEventListener("keydown", function (e) {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); if (currentIndex > 0) setVideo(currentIndex - 1, true); }
    if (e.key === "ArrowRight") { e.preventDefault(); if (currentIndex < videos.length - 1) setVideo(currentIndex + 1, true); }
  });

  // 初始化
  goChapter(currentChapter || 2);
})();
</script>
</body>
</html>
