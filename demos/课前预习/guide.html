<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《大学物理·力学》课前预习 · 智慧导学单</title>

    <!-- KaTeX 公式渲染（CDN） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Font Awesome 图标（与参考文件风格一致） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root{
            --bg: #0f172a;
            --bg2: #1e293b;
            --card: rgba(30,41,59,0.55);
            --border: rgba(148,163,184,0.18);
            --text: #f8fafc;
            --muted: #94a3b8;
            --cyan: #38bdf8;
            --indigo: #818cf8;
            --emerald: #34d399;
            --amber: #fbbf24;
            --rose: #fb7185;
        }

        *{ box-sizing: border-box; }

        html, body{ margin: 0; padding: 0; }

        body{
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(at 12% 12%, rgba(56,189,248,0.10) 0px, transparent 45%),
                radial-gradient(at 88% 18%, rgba(129,140,248,0.10) 0px, transparent 45%),
                radial-gradient(at 50% 100%, rgba(56,189,248,0.06) 0px, transparent 55%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar{ width: 8px; height: 8px; }
        ::-webkit-scrollbar-track{ background: var(--bg); }
        ::-webkit-scrollbar-thumb{ background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover{ background: #475569; }

        /* ---------- 顶部固定导航栏 ---------- */
        header.topbar{
            position: sticky;
            top: 0;
            z-index: 40;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            background: rgba(15,23,42,0.88);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
        }
        .topbar-inner{
            max-width: 1100px;
            margin: 0 auto;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
        }
        .brand{ display: flex; align-items: center; gap: 12px; min-width: 0; }
        .brand-logo{
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, var(--cyan), var(--indigo));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 18px rgba(56,189,248,0.35);
            flex-shrink: 0;
        }
        .brand-logo i{ color: #fff; font-size: 20px; }
        .brand-text{ min-width: 0; }
        .brand-badge{
            display: inline-block;
            font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 2px 8px; border-radius: 999px;
            background: rgba(56,189,248,0.15);
            color: var(--cyan);
            border: 1px solid rgba(56,189,248,0.35);
        }
        .brand-title{
            font-size: 15px; font-weight: 700; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-top: 2px;
        }

        .topbar-controls{ display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .chapter-select{
            background: var(--bg2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }
        .chapter-select:focus{ border-color: var(--cyan); }

        .home-btn{
            display: inline-flex; align-items: center; gap: 7px;
            padding: 9px 15px; border-radius: 10px;
            font-size: 13px; font-weight: 600; color: #fff;
            text-decoration: none;
            background: linear-gradient(135deg, #f43f5e, #ec4899);
            box-shadow: 0 6px 18px rgba(244,63,94,0.30);
            transition: transform .15s ease, filter .15s ease;
            white-space: nowrap;
        }
        .home-btn:hover{ transform: translateY(-1px); filter: brightness(1.08); }

        /* ---------- 章节切换条 ---------- */
        .chapter-strip{
            max-width: 1100px; margin: 16px auto 0; padding: 0 18px;
        }
        .chapter-chips{
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
        }
        .chip{
            flex: 0 0 auto;
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 13px; border-radius: 999px;
            font-size: 12.5px; font-weight: 600;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--muted);
            cursor: pointer; white-space: nowrap;
            transition: all .15s ease;
        }
        .chip:hover{ color: var(--text); border-color: rgba(56,189,248,0.4); }
        .chip.active{
            color: #06121f;
            background: linear-gradient(135deg, var(--cyan), var(--indigo));
            border-color: transparent;
        }
        .chip .num{
            width: 18px; height: 18px; border-radius: 50%;
            background: rgba(148,163,184,0.2); color: inherit;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700;
        }
        .chip.active .num{ background: rgba(6,18,31,0.25); }

        /* ---------- 主体 ---------- */
        main{ max-width: 1100px; margin: 0 auto; padding: 18px 18px 80px; }

        .hero{
            background: linear-gradient(120deg, rgba(30,41,59,0.7), rgba(129,140,248,0.18) 60%, rgba(30,41,59,0.7));
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px 26px;
            margin-bottom: 22px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
        }
        .hero-pill{
            display: inline-flex; align-items: center; gap: 7px;
            font-size: 12px; font-weight: 700;
            padding: 4px 12px; border-radius: 999px;
            background: rgba(56,189,248,0.15);
            color: var(--cyan);
            border: 1px solid rgba(56,189,248,0.35);
            margin-bottom: 12px;
        }
        .hero h1{
            margin: 0; font-size: 26px; font-weight: 800; color: #fff;
            letter-spacing: -0.01em;
        }
        .hero h1 .ch-no{ color: var(--cyan); }
        .hero .subtitle{
            margin-top: 8px; font-size: 14px; color: var(--muted);
        }

        /* 模块区块 */
        .module{ margin-bottom: 26px; }
        .module-head{
            display: flex; align-items: center; gap: 11px;
            margin-bottom: 14px;
        }
        .module-icon{
            width: 36px; height: 36px; border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            background: rgba(56,189,248,0.14);
            color: var(--cyan);
            border: 1px solid rgba(56,189,248,0.30);
        }
        .module-head h2{
            margin: 0; font-size: 18px; font-weight: 700; color: #fff;
        }
        .module-head .en{
            font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 2px;
        }

        /* 卡片 */
        .card{
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
        }

        /* 学习目标 / 前置知识 / 问题 列表 */
        .list{ display: flex; flex-direction: column; gap: 10px; }
        .list-item{
            display: flex; gap: 12px; align-items: flex-start;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px 16px;
            font-size: 14.5px; line-height: 1.6; color: #e2e8f0;
        }
        .list-item .marker{
            flex-shrink: 0; margin-top: 1px;
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; color: #06121f;
            background: linear-gradient(135deg, var(--cyan), var(--indigo));
        }
        .list-item.q .marker{ background: linear-gradient(135deg, var(--amber), #f97316); }
        .list-item.pre .marker{ background: linear-gradient(135deg, var(--emerald), #10b981); }

        /* 核心概念卡片网格 */
        .concept-grid{
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px;
        }
        .concept-card{
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            transition: border-color .15s ease, transform .15s ease;
        }
        .concept-card:hover{ border-color: rgba(56,189,248,0.4); transform: translateY(-2px); }
        .concept-term{
            font-size: 15px; font-weight: 700; color: var(--cyan);
            margin-bottom: 6px;
        }
        .concept-def{ font-size: 13.5px; line-height: 1.6; color: var(--muted); }

        /* 公式卡片 */
        .formula-grid{
            display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 14px;
        }
        .formula-card{
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 18px 14px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .formula-box{
            width: 100%;
            background: rgba(15,23,42,0.55);
            border: 1px solid rgba(56,189,248,0.18);
            border-radius: 10px;
            padding: 16px 12px;
            text-align: center;
            overflow-x: auto;
        }
        .formula-note{
            font-size: 13px; line-height: 1.6; color: var(--muted);
            border-top: 1px dashed var(--border); padding-top: 10px;
        }
        .formula-note b{ color: var(--indigo); font-weight: 600; }

        /* 提示框 */
        .hint{
            display: flex; gap: 12px; align-items: flex-start;
            border-radius: 12px; padding: 13px 16px;
            font-size: 13.5px; line-height: 1.6; margin-top: 12px;
        }
        .hint i{ margin-top: 2px; font-size: 15px; flex-shrink: 0; }
        .hint.info{ background: rgba(56,189,248,0.10); border: 1px solid rgba(56,189,248,0.28); color: #cbeafe; }
        .hint.info i{ color: var(--cyan); }
        .hint.success{ background: rgba(52,211,153,0.10); border: 1px solid rgba(52,211,153,0.28); color: #bbf7e3; }
        .hint.success i{ color: var(--emerald); }

        /* 页脚 */
        footer{
            max-width: 1100px; margin: 0 auto; padding: 20px 18px 40px;
            text-align: center; color: var(--muted); font-size: 12.5px;
            border-top: 1px solid var(--border);
        }

        .no-print{ }

        @media print{
            .no-print{ display: none !important; }
            body{ background: #fff; color: #000; }
            .card, .list-item, .concept-card, .formula-card{ background: #fff; border-color: #ccc; }
        }

        @media (max-width: 640px){
            .brand-title{ font-size: 13px; }
            .hero h1{ font-size: 21px; }
            .topbar-controls{ width: 100%; }
        }
    </style>
</head>
<body>

    <!-- ==================== 顶部固定导航栏 ==================== -->
    <header class="topbar no-print">
        <div class="topbar-inner">
            <div class="brand">
                <div class="brand-logo"><i class="fa-solid fa-atom"></i></div>
                <div class="brand-text">
                    <span class="brand-badge">智慧物理导学</span>
                    <div class="brand-title" id="brandTitle">《大学物理·力学》课前预习导学单</div>
                </div>
            </div>
            <div class="topbar-controls">
                <select class="chapter-select no-print" id="chapterSelect" onchange="goChapter(this.value)" aria-label="选择章节"></select>
                <a href="../../index.html" class="home-btn no-print" title="返回《力学》AI 智慧课程主页">
                    <i class="fa-solid fa-house"></i> 返回课程主页
                </a>
            </div>
        </div>
    </header>

    <!-- 章节快速切换条 -->
    <div class="chapter-strip no-print">
        <div class="chapter-chips" id="chapterChips"></div>
    </div>

    <main>
        <!-- 章节主标题横幅 -->
        <section class="hero" id="hero">
            <span class="hero-pill"><i class="fa-solid fa-compass"></i> 课前预习 · 智慧导学单</span>
            <h1 id="heroTitle">第 N 章 · 章名</h1>
            <div class="subtitle" id="heroSub">带着目标、概念、公式与问题进入课堂，让 15 分钟预习真正发生。</div>
        </section>

        <div id="content"><!-- 动态渲染 --></div>
    </main>

    <footer class="no-print">
        《大学物理·力学》AI 智慧课程 · 课前预习统一导学单 · 共 12 章 · 公式由 KaTeX 渲染
    </footer>

    <script>
        /* ===================== 章节元信息 ===================== */
        const CHAPTER_TITLES = {
            1:'质点运动学', 2:'牛顿运动定律', 3:'动量守恒', 4:'动能定理与功能原理',
            5:'角动量与力矩', 6:'刚体定轴转动', 7:'刚体平面运动', 8:'机械振动',
            9:'机械波', 10:'流体力学', 11:'万有引力与天体运动', 12:'狭义相对论基础'
        };

        /* ===================== 导学单数据 ===================== */
        const GUIDE_DATA = {
        1:{
            objectives:[
                '建立质点模型，理解参考系与坐标系的选择对运动描述的影响',
                '掌握位置矢量、位移、速度、加速度的定义及其矢量关系',
                '熟练运用直角坐标与自然坐标（切向 / 法向）描述曲线运动',
                '掌握圆周运动的角量与线量关系',
                '理解相对运动中的速度叠加原理'
            ],
            concepts:[
                {term:'位置矢量 $\\vec r$', def:'从原点指向质点所在位置的矢量，唯一确定质点在空间中的位置。'},
                {term:'位移 $\\Delta\\vec r$', def:'一段时间内位置矢量的改变量，$\\Delta\\vec r=\\vec r_2-\\vec r_1$，只与始末位置有关。'},
                {term:'速度 $\\vec v=\\dfrac{d\\vec r}{dt}$', def:'描述位置变化快慢与方向的矢量，是位置对时间的一阶导数。'},
                {term:'加速度 $\\vec a=\\dfrac{d\\vec v}{dt}$', def:'描述速度变化快慢与方向的矢量，是速度对时间的一阶导数。'},
                {term:'切向加速度 $a_t$', def:'$a_t=\\dfrac{dv}{dt}$，只改变速度的大小，沿轨迹切线方向。'},
                {term:'法向加速度 $a_n$', def:'$a_n=\\dfrac{v^2}{\\rho}$，只改变速度的方向，$\\rho$ 为轨迹曲率半径。'}
            ],
            formulas:[
                {tex:'\\vec r = x\\,\\hat i + y\\,\\hat j + z\\,\\hat k', note:'质点的位置矢量在直角坐标系中的分量形式。'},
                {tex:'\\vec v = \\frac{d\\vec r}{dt} = \\dot x\\,\\hat i + \\dot y\\,\\hat j + \\dot z\\,\\hat k', note:'<b>速度</b>等于位置矢量对时间的一阶导数，分量即各坐标对时间的变化率。'},
                {tex:'\\vec a = \\frac{d\\vec v}{dt} = \\frac{d^2\\vec r}{dt^2}', note:'<b>加速度</b>为速度对时间的一阶导数，或位置对时间的二阶导数。'},
                {tex:'a_t = \\frac{dv}{dt},\\quad a_n = \\frac{v^2}{\\rho},\\quad a = \\sqrt{a_t^2 + a_n^2}', note:'自然坐标系下加速度分解为切向与法向，二者相互垂直。'},
                {tex:'v = \\omega r,\\quad a_n = \\omega^2 r', note:'圆周运动中角速度 $\\omega$ 与线速度 $v$、法向加速度的关系。'},
                {tex:'\\vec v_{A/C} = \\vec v_{A/B} + \\vec v_{B/C}', note:'<b>相对运动速度叠加</b>：A 对 C 的速度等于 A 对 B 与 B 对 C 的速度矢量之和。'}
            ],
            prereq:[
                '高中运动的描述：位移、速度、加速度与匀变速直线运动公式',
                '高中数学的平面 / 空间直角坐标系与三角函数',
                '微积分基础：导数与定积分的概念（建议与高等数学同步学习）',
                '矢量的加法与数乘运算'
            ],
            questions:[
                '位移和路程有什么区别？什么情况下二者大小相等？',
                '速度为零的瞬间，加速度是否一定为零？请举出反例。',
                '物体做曲线运动时，加速度是否一定指向曲线凹侧？为什么？',
                '匀速圆周运动的加速度不为零，它改变的是速度的哪个部分？',
                '在相对运动中，为什么“顺水行舟”的速度要用矢量相加而不是直接加减数值？'
            ]
        },
        2:{
            objectives:[
                '准确理解牛顿三定律的物理含义与适用条件',
                '掌握常见力（重力、弹力、摩擦力）的性质与受力分析方法',
                '熟练建立牛顿第二定律的微分方程并求解一维运动',
                '理解惯性系与非惯性系，了解惯性力的引入',
                '掌握用牛顿定律处理连接体、变力作用下的运动'
            ],
            concepts:[
                {term:'惯性', def:'物体保持原有运动状态不变的性质，是牛顿第一定律的核心。'},
                {term:'合外力 $\\vec F$', def:'质点所受所有外力的矢量和，决定其加速度。'},
                {term:'质量 $m$', def:'物体惯性大小的量度，也是引力质量与惯性质量的统一。'},
                {term:'惯性力 $\\vec F_{惯}=-m\\vec a_0$', def:'在非惯性系中为使牛顿第二定律成立而引入的虚拟力，无施力物体。'},
                {term:'约束力', def:'方向由约束条件决定（如法向支持力、绳中张力），大小由动力学方程解出。'}
            ],
            formulas:[
                {tex:'\\vec F = \\frac{d\\vec p}{dt}', note:'牛顿第二定律的<b>普遍形式</b>，$\\vec p=m\\vec v$ 为动量，适用于变质量情形。'},
                {tex:'\\vec F = m\\vec a', note:'质量恒定（远小于光速）时牛顿第二定律的常见形式。'},
                {tex:'m\\ddot x = F_x,\\quad m\\ddot y = F_y,\\quad m\\ddot z = F_z', note:'牛顿第二定律在直角坐标系中的分量方程。'},
                {tex:'f = \\mu N', note:'滑动摩擦力大小，$\\mu$ 为动摩擦因数，$N$ 为接触面正压力。'},
                {tex:'\\vec F_{\\text{惯}} = -m\\vec a_0', note:'非惯性系中引入的<b>惯性力</b>，$\\vec a_0$ 为该参考系相对惯性系的加速度。'}
            ],
            prereq:[
                '第一章质点运动学（速度、加速度、矢量微积分）',
                '高中受力分析（重力、弹力、摩擦力）',
                '矢量的正交分解',
                '常微分方程初步（一阶、二阶线性微分方程）'
            ],
            questions:[
                '牛顿第一定律看似“无用”，它真正的物理意义是什么？',
                '质量与重量有何区别？在月球上物体的惯性会改变吗？',
                '人推墙时墙也推人，为什么人还能前进？这与牛顿第三定律矛盾吗？',
                '为什么在加速上升的电梯里称体重会“变重”？怎样用惯性力解释？',
                '变力 $F(x)$ 作用下，如何由牛顿第二定律求出速度与位置的关系？'
            ]
        },
        3:{
            objectives:[
                '理解动量与冲量的概念，掌握动量定理',
                '理解质点系的质心与质心运动定理',
                '掌握动量守恒定律的适用条件与典型应用',
                '能处理碰撞、反冲等问题中的动量守恒',
                '理解火箭推进的动量原理'
            ],
            concepts:[
                {term:'动量 $\\vec p=m\\vec v$', def:'描述物体机械运动状态的物理量，是矢量，具有瞬时性。'},
                {term:'冲量 $\\vec I=\\int\\vec F\\,dt$', def:'力对时间的累积效应，等于力的时间积分。'},
                {term:'质心', def:'质点系质量分布的平均位置，$\\vec r_C=\\dfrac{\\sum m_i\\vec r_i}{\\sum m_i}$。'},
                {term:'系统', def:'为研究方便划定的多个相互作用物体集合，区分内力与外力。'},
                {term:'内力 / 外力', def:'系统内部物体间的作用力 / 系统外物体施加的力，内力不改变系统总动量。'}
            ],
            formulas:[

                '伯努利方程成立的前提条件有哪些？对实际流体需修正什么？',
                '用吸管喝水，是“吸力”把水吸上来的吗？压强如何变化？',
                '静止流体中压强只与深度有关、与容器形状无关，为什么？',
                '飞机机翼升力与伯努利原理有什么关系？上下表面流速为何不同？'
            ]
        },
        11:{
            objectives:[
                '掌握万有引力定律及其在球对称质量分布下的引力场',
                '理解引力势能与引力势',
                '掌握开普勒三定律及其与牛顿力学的联系',
                '理解三种宇宙速度与第一、二宇宙速度的推导',
                '掌握圆轨道、椭圆轨道运动（有心力场）的基本规律'
            ],
            concepts:[
                {term:'万有引力', def:'任何两质点间存在与质量乘积成正比、与距离平方成反比的吸引力。'},
                {term:'引力场强 $\\vec g=\\vec F/m$', def:'单位质量所受引力，方向指向场源。'},
                {term:'引力势能', def:'将物体从无穷远移到某点引力所做的负功（取无穷远为零）。'},
                {term:'开普勒定律', def:'行星沿椭圆轨道运行、面积速度恒定、周期平方正比于半长轴立方。'},
                {term:'宇宙速度', def:'第一（环绕）、第二（逃逸）、第三（脱离太阳）宇宙速度。'}
            ],
            formulas:[
                {tex:"F = G\\frac{m_1 m_2}{r^2}", note:'<b>万有引力定律</b>，$G$ 为引力常量，$r$ 为两质点距离。'},
                {tex:'\\vec g = -\\frac{GM}{r^2}\\,\\hat r', note:'球对称质量 $M$ 外部的<b>引力场强</b>（球壳外等效于质点）。'},
                {tex:'U = -G\\frac{Mm}{r}', note:'<b>引力势能</b>，取无穷远处为零（故为负值）。'},
                {tex:'E = \\frac12 mv^2 - G\\frac{Mm}{r}', note:'物体在引力场中的<b>机械能</b>。'},
                {tex:'v_1 = \\sqrt{\\frac{GM}{R}}', note:'<b>第一宇宙速度</b>（近地圆轨道环绕速度）。'},
                {tex:'\\frac{a^3}{T^2} = \\frac{GM}{4\\pi^2}', note:'<b>开普勒第三定律</b>的圆轨道推广。'},
                {tex:'v_{\\text{esc}} = \\sqrt{\\frac{2GM}{R}} = \\sqrt{2}\\,v_1', note:'<b>第二宇宙速度</b>（逃逸速度）。'}
            ],
            prereq:[
                '第五章角动量与有心力（开普勒第二定律即角动量守恒）',
                '第四章势能、能量守恒',
                '圆锥曲线与极坐标'
            ],
            questions:[
                '万有引力定律中 $r$ 指什么？对球体为何可用球心距离？',
                '引力势能为什么是负值？“负值”代表什么物理意义？',
                '开普勒第二定律（面积定律）本质是什么守恒？',
                '第一宇宙速度与第二宇宙速度差一个 $\\sqrt{2}$，这从能量角度如何理解？',
                '地球同步卫星的轨道高度由什么决定？它必须满足哪些条件？'
            ]
        },
        12:{
            objectives:[
                '理解伽利略相对性原理及其在高速下的失效',
                '掌握爱因斯坦两个基本假设（相对性原理与光速不变原理）',
                '掌握洛伦兹变换与同时性的相对性',
                '理解时间膨胀与长度收缩',
                '掌握质速关系与质能方程 $E=mc^2$'
            ],
            concepts:[
                {term:'惯性系', def:'牛顿定律成立的参考系，狭义相对论只讨论惯性系。'},
                {term:'光速不变原理', def:'真空中光速对所有惯性系观察者都相同，与光源运动无关。'},
                {term:'同时性的相对性', def:'在一个惯性系中同时发生的两事件，在另一系未必同时。'},
                {term:'固有时 $\\Delta\\tau$', def:'在事件发生于同一地点的参考系中测得的时间间隔（最短）。'},
                {term:'质能等价', def:'能量与质量可相互转化，$E=mc^2$。'}
            ],
            formulas:[
                {tex:'x\' = \\gamma(x-vt),\\quad t\' = \\gamma\\!\\left(t-\\frac{vx}{c^2}\\right),\\quad \\gamma=\\frac{1}{\\sqrt{1-v^2/c^2}}', note:'<b>洛伦兹变换</b>：两惯性系间时空坐标的变换关系。'},
                {tex:'\\Delta t = \\gamma\\,\\Delta\\tau', note:'<b>时间膨胀</b>：运动参考系中测得的时间间隔更长（“钟慢”）。'},
                {tex:'L = L_0/\\gamma', note:'<b>长度收缩</b>：运动方向上尺寸变短，$L_0$ 为固有长度。'},
                {tex:'m = \\frac{m_0}{\\sqrt{1-v^2/c^2}}', note:'相对论质量，$m_0$ 为静质量。'},
                {tex:'E = \\gamma m_0 c^2,\\quad E^2 = p^2c^2 + m_0^2c^4', note:'总能量与<b>能量-动量关系</b>。'},
                {tex:'E_k = (\\gamma-1)m_0c^2', note:'相对论动能，低速下退化为 $\\tfrac12m_0v^2$。'},
                {tex:'E = m_0c^2', note:'<b>质能方程</b>：静能与质量的关系，核反应释能的根源。'}
            ],
            prereq:[
                '伽利略变换与经典力学相对性',
                '矢量与坐标系变换',
                '能量与动量概念'
            ],
            questions:[
                '为什么牛顿力学在高速下会“失效”？经典伽利略变换哪里不对？',
                '若你以接近光速随列车运动，看到地面上的钟是变快还是变慢？为什么？',
                '“时间膨胀”和“长度收缩”相互矛盾吗？怎样理解参考系对等？',
                '一个粒子的速度能超过光速吗？从洛伦兹因子 $\\gamma$ 如何看出？',
                '$E=mc^2$ 是否意味着“质量可以转化为能量”？核反应释放能量与什么有关？'
            ]
        }
        };

        /* ===================== 读取章节参数 ===================== */
        const ch = new URLSearchParams(location.search).get('ch') || '1';
        let chNum = parseInt(ch, 10);
        if (!(chNum >= 1 && chNum <= 12)) chNum = 1;

        /* ===================== 渲染逻辑 ===================== */
        function buildControls(){
            const sel = document.getElementById('chapterSelect');
            const chips = document.getElementById('chapterChips');
            for (let i = 1; i <= 12; i++){
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `第 ${i} 章 · ${CHAPTER_TITLES[i]}`;
                sel.appendChild(opt);

                const chip = document.createElement('button');
                chip.className = 'chip' + (i === chNum ? ' active' : '');
                chip.innerHTML = `<span class="num">${i}</span>${CHAPTER_TITLES[i]}`;
                chip.onclick = () => goChapter(i);
                chips.appendChild(chip);
            }
            sel.value = chNum;
        }

        function goChapter(n){
            chNum = Math.min(12, Math.max(1, parseInt(n, 10)));
            const url = new URL(location.href);
            url.searchParams.set('ch', chNum);
            history.replaceState(null, '', url);
            document.getElementById('chapterSelect').value = chNum;
            document.querySelectorAll('.chip').forEach((c, i) => c.classList.toggle('active', (i + 1) === chNum));
            render();
        }

        function listHTML(items, cls){
            return `<div class="list">` + items.map((t, i) => {
                const idx = cls === 'q' ? '？' : (i + 1);
                return `<div class="list-item ${cls}"><span class="marker">${idx}</span><div>${t}</div></div>`;
            }).join('') + `</div>`;
        }

        function render(){
            const data = GUIDE_DATA[chNum];
            if (!data) return;

            document.getElementById('brandTitle').textContent =
                `《大学物理·力学》第 ${chNum} 章 · ${CHAPTER_TITLES[chNum]} · 课前预习导学单`;
            document.getElementById('heroTitle').innerHTML =
                `第 <span class="ch-no">${chNum}</span> 章 · ${CHAPTER_TITLES[chNum]} <span style="opacity:.7">· 课前预习导学单</span>`;

            const conceptHTML = `<div class="concept-grid">` + data.concepts.map(c =>
                `<div class="concept-card"><div class="concept-term">${c.term}</div><div class="concept-def">${c.def}</div></div>`
            ).join('') + `</div>`;

            const formulaHTML = `<div class="formula-grid">` + data.formulas.map(f =>
                `<div class="formula-card">
                    <div class="formula-box">$$${f.tex}$$</div>
                    <div class="formula-note">${f.note}</div>
                 </div>`
            ).join('') + `</div>`;

            const html = `
                <section class="module">
                    <div class="module-head">
                        <div class="module-icon"><i class="fa-solid fa-bullseye"></i></div>
                        <h2>学习目标 <span class="en">Objectives</span></h2>
                    </div>
                    ${listHTML(data.objectives, '')}
                </section>

                <section class="module">
                    <div class="module-head">
                        <div class="module-icon"><i class="fa-solid fa-lightbulb"></i></div>
                        <h2>核心概念 <span class="en">Key Concepts</span></h2>
                    </div>
                    ${conceptHTML}
                </section>

                <section class="module">
                    <div class="module-head">
                        <div class="module-icon"><i class="fa-solid fa-square-root-variable"></i></div>
                        <h2>关键公式 <span class="en">Key Formulas</span></h2>
                    </div>
                    ${formulaHTML}
                    <div class="hint info"><i class="fa-solid fa-circle-info"></i>
                        <div>公式卡片中<b style="color:var(--cyan)">蓝色框</b>为表达式，下方为推导思路或物理含义。预习时请先遮住含义、自行口述一遍。</div>
                    </div>
                </section>

                <section class="module">
                    <div class="module-head">
                        <div class="module-icon"><i class="fa-solid fa-layer-group"></i></div>
                        <h2>前置知识 <span class="en">Prerequisites</span></h2>
                    </div>
                    ${listHTML(data.prereq, 'pre')}
                </section>

                <section class="module">
                    <div class="module-head">
                        <div class="module-icon"><i class="fa-solid fa-question"></i></div>
                        <h2>预习导引问题 <span class="en">Guiding Questions</span></h2>
                    </div>
                    ${listHTML(data.questions, 'q')}
                    <div class="hint success"><i class="fa-solid fa-lightbulb"></i>
                        <div>带着这 ${data.questions.length} 个问题进入课堂，听到相关讲解时请重点标记——这是你本节课最需要澄清的迷思点。</div>
                    </div>
                </section>
            `;
            document.getElementById('content').innerHTML = html;

            if (window.renderMathInElement){
                renderMathInElement(document.getElementById('content'), {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        /* ===================== 初始化 ===================== */
        window.addEventListener('load', function(){
            buildControls();
            render();
        });
    </script>
</body>
</html>
